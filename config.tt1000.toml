# TT1000 冷柜监控场景：MQTT -> InfluxDB 3 Core，按年月分表 + 显式列映射。
# 列只留查询要用的，完整 payload 进 data 列做归档；数据模型、部署步骤与风险清单见 deploy.md。
# 用法：cp config.tt1000.toml config.toml 后按实际 broker / productKey 修改，
#      或直接用 python -m mqtt_influx_bridge -c config.tt1000.toml check 试跑。
#      容器版配置在 deploy/config/config.toml.example，与本文件同源。

[mqtt]
host = "127.0.0.1"
port = 1883
topics = []                           # 留空 = 自动订阅下面所有 [[route]].topics
qos = 1
client_id = "influx-bridge-tt1000-01"  # 必须固定且全局唯一，持久会话靠它恢复
persistent_session = true
username = ""
password = ""
keepalive = 60
tls_ca = ""

[influx]
version = "v3"
url = "http://127.0.0.1:8181"
database = "mqtt"
token = ""                            # 用 INFLUX_TOKEN 环境变量注入
auto_create_database = true           # 启动时建库（幂等；失败只告警，不影响启动）
retention_period = ""                 # 建库时的保留期，如 30d；库已存在则不生效
timeout_seconds = 10
no_sync = false                       # 等 InfluxDB WAL 持久化再返回 2xx
accept_partial = false                # 整批原子；配合 writer.split_on_reject 二分定位坏行
gzip = true

[mapping]
year_tz_offset_minutes = 480          # 分表按 UTC+8 切：2026-12-31 23:30+08 仍写 _202612
# 单产品部署建议用环境变量收紧：PRODUCT_KEY=TT1000
substitutions = {}                    # 留空则 ${productKey} 按 + 处理（订阅全部产品）

# 1) 设备上行：status / alarms 共用一张按月分表
[[route]]
name = "uplink"
topics = ["${productKey}/+/data"]     # TODO 换成设备实际发布 topic（deploy.md §11 问题 1）
measurement = "mqtt_data"
year_table = true                     # 追加时间后缀
table_period = "month"                # year -> _2026，month -> _202611
timestamp_path = "time"
timestamp_unit = "auto"               # 1793936202 这类秒级时间戳自动识别
mode = "explicit"                     # 只建下面声明的列；其余 key 只在 data 里归档
tags = { event = "event", devicecode = "deviceCode", imei = "imei" }
static_tags = {}
fields = { code = "code:float", door_num = "door_num" }
blob_field = "data"
topic_field = "topic"
key_case = "lower"

# 2) 控制端下行命令 -> device_control_{month}
[[route]]
name = "control"
topics = ["${productKey}/+/control"]
measurement = "device_control"
year_table = true
table_period = "month"
timestamp_path = "time"
timestamp_unit = "auto"
mode = "explicit"
tags = { event = "action", devicecode = "deviceCode" }
static_tags = { direction = "downlink" }
fields = { uuid = "uuid:str", code = "code:float" }
blob_field = "data"
topic_field = "topic"
key_case = "lower"

# 3) 设备对命令的回执 -> 与下行同表，靠 direction 区分
[[route]]
name = "response"
topics = ["${productKey}/+/response/+"]
measurement = "device_control"
year_table = true
table_period = "month"
timestamp_path = "time"
timestamp_unit = "auto"
mode = "explicit"
tags = { event = "action", devicecode = "deviceCode" }
static_tags = { direction = "uplink" }
fields = { uuid = "uuid:str", code = "code:float" }
blob_field = "data"
topic_field = "topic"
key_case = "lower"

# 兜底：未被上面命中的 topic 进这张表（只有 blob，不参与查询），用于发现新设备/新 topic
[[route]]
name = "fallback"
topics = ["#"]
measurement = "mqtt_unknown"
year_table = true
table_period = "month"
timestamp_path = "time"
timestamp_unit = "auto"
mode = "explicit"
tags = { devicecode = "deviceCode" }
static_tags = { matched = "false" }
blob_field = "data"
topic_field = "topic"

[wal]
path = "./data/bridge.db"
max_pending = 500000

[writer]
batch_size = 1000
flush_interval_ms = 200
retry_base_ms = 500
retry_max_ms = 30000
max_retries = 0
ack_mode = "persisted"
when_full = "block"
split_on_reject = true                # 一行字段类型冲突不拖垮整批
max_split_probes = 64

[log]
level = "INFO"
stats_interval_seconds = 30
