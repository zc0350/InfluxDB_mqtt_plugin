# MQTT broker 配置（桥接器场景专用）
# 挂载到容器内 /mosquitto/config/mosquitto.conf

listener 1883 0.0.0.0
protocol mqtt

# 生产环境保持鉴权开启。开发内网临时放开：只允许在 broker 不对外暴露端口时改成 allow_anonymous true
allow_anonymous false
password_file /mosquitto/config/passwd

# ---- QoS 1 持久会话：桥接器离线期间的消息靠 broker 排队，这里决定能排多少 ----
# 默认 queued_message_limit=1000，超出后 broker 直接丢弃最老的消息 —— 桥接器停一天就丢一天数据。
# 0 = 不限量（内存换可靠性）。mosquitto 1.x 的老名字 max_queued_messages 已废弃，别再写。
queued_message_limit 1000000

# 默认 20，与 MQTT 3.1.1 in-flight 窗口一致。ack_mode=written 时桥接器靠这个窗口形成背压。
max_inflight_messages 20

# 持久客户端记录过期时间。留空 = 永不过期（推荐：桥接器可能停机升级数天）。
# persistent_client_expiration 4w

# ---- 会话与消息持久化 ----
persistence true
persistence_location /mosquitto/data/
autosave_interval 180

# ---- 日志 ----
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type warning
log_type error
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# ---- 可选：设备侧 TLS（默认关闭）----
# listener 8883 0.0.0.0
# certfile /mosquitto/config/tls/server.crt
# keyfile  /mosquitto/config/tls/server.key
# cafile   /mosquitto/config/tls/ca.crt
# require_certificate true
