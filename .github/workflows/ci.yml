name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q mqtt_influx_bridge tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # 三代后端的真实冒烟：mock 只能证明「我们按文档的形状发请求」，这条 job 证明后端真的收。
  # 用 docker run 而不是 services:，因为三家的端口、启动参数、初始化 env 差异太大，
  # services 的 image/env/ports 字段吃 matrix 模板时数组展开很容易踩坑。
  backend-smoke:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: v1
            image: influxdb:1.8-alpine
            port: 8086
            init_env: ""
            run_args: ""
            cmd: ""
            url: http://127.0.0.1:8086
            db: mqtt
            org: ""
            token: ""
          - backend: v2
            image: influxdb:2.7-alpine
            port: 8086
            init_env: >-
              -e DOCKER_INFLUXDB_INIT_MODE=setup
              -e DOCKER_INFLUXDB_INIT_USERNAME=ci
              -e DOCKER_INFLUXDB_INIT_PASSWORD=ci-password-12
              -e DOCKER_INFLUXDB_INIT_ORG=ci
              -e DOCKER_INFLUXDB_INIT_BUCKET=mqtt
              -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=ci-token
            run_args: ""
            cmd: ""
            url: http://127.0.0.1:8086
            db: mqtt
            org: ci
            token: ci-token
          - backend: v3
            image: influxdb:3-core
            port: 8181
            init_env: ""
            run_args: --entrypoint influxdb3
            cmd: >-
              serve --node-id=ci --object-store=file
              --data-dir=/var/lib/influxdb3 --without-auth
            url: http://127.0.0.1:8181
            db: mqtt
            org: ""
            token: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start ${{ matrix.backend }}
        run: |
          docker run -d --name db -p ${{ matrix.port }}:${{ matrix.port }} \
            ${{ matrix.init_env }} ${{ matrix.run_args }} ${{ matrix.image }} ${{ matrix.cmd }}
          for i in $(seq 1 60); do
            curl -sf "${{ matrix.url }}/ping" >/dev/null 2>&1 && break
            curl -sf "${{ matrix.url }}/health" >/dev/null 2>&1 && break
            sleep 1
            [ "$i" = 60 ] && { docker logs db; exit 1; }
          done

      - name: Smoke test against the real backend
        env:
          LIVE_INFLUX_URL: ${{ matrix.url }}
          LIVE_INFLUX_VERSION: ${{ matrix.backend }}
          LIVE_INFLUX_DB: ${{ matrix.db }}
          LIVE_INFLUX_ORG: ${{ matrix.org }}
          LIVE_INFLUX_TOKEN: ${{ matrix.token }}
        run: python -m unittest tests.test_backends_live -v

      - name: Backend logs on failure
        if: failure()
        run: docker logs db

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build wheel + sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
